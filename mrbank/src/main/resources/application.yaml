server:
  port: 8000

spring:
  application:
    name: mrbank
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/mrbank
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_EMAIL:your-email@gmail.com}
    password: ${GMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  threads:
    virtual:
      enabled: true

application:
  security:
    jwt:
      secret: "bXItdGVtcG9yYXJ5LWxvY2FsLWRldi1qd3Qtc2VjcmV0LWtleS1tdXN0LWJlLWxvbmc="
      access-token-expiration: 15m
      refresh-token-expiration: 7d
  email:
    from: ${GMAIL_EMAIL:your-email@gmail.com}
    from-name: "MR Bank"
  api:
    paths:
      auth: /api/v1/public/auth
      users: /api/v1/users
      accounts: /api/v1/accounts
      transactions: /api/v1/transactions
  otp:
    max:
      attempts: ${OTP_MAX_ATTEMPTS:5}
    # HMAC key for codes stored in Redis. Override this outside local development.
    hmac-secret: ${OTP_HMAC_SECRET:local-dev-otp-hmac-secret-change-me}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    xyz.rawmanoj.mrbank: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mrbank.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB
